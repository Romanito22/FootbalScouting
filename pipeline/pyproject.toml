[project]
name = "vivier-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "soccerdata>=1.9",
  "statsbombpy>=1.14",
  "pandas>=2.2",
  "duckdb>=1.1",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.10",
  "unidecode>=1.3",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8.3", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vivier_pipeline"]
